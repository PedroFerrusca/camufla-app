volumes:
  camufla_db_data:


services:
  web:
    build:
      context: .
      target: runner


    volumes:
      - .:/app
    ports:
      - 8080:8080
    environment:
      DB_NAME: camufla_db
      DB_HOST: db 
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DATABASE_URL: postgres://postgres:postgres@db:5432/camufla_db 
    depends_on:
      - db
    command: ["uv", "run", "manage.py", "start_app", "--port", "8000"]

  db:
    image: postgres:15
    container_name: camufla_db_postgres
    ports:
      - 5432:5432
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: camufla_db
    restart: unless-stopped
    volumes:
      - camufla_db_data:/var/lib/postgresql/data
  
  redis:
    image: redis:7-alpine
    ports:
      - ${REDIS_PORT:-6379}:6379